version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: custom-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # Git Sync Paths
    AIRFLOW__CORE__DAGS_FOLDER: /git/repo/airflow/dags
    AIRFLOW__CORE__PLUGINS_FOLDER: /git/repo/airflow/plugins
  volumes:
    - ./airflow/logs:/opt/airflow/logs
    - ./models:/opt/airflow/models # Mount models for DAG execution
    - git-sync-data:/git:ro
  depends_on: &airflow-common-depends-on
    postgres_airflow:
      condition: service_healthy

services:
  # --- Databases ---
  postgres_mlflow:
    image: postgres:13
    container_name: postgres_mlflow
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_mlflow_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "mlflow" ]
      interval: 5s
      retries: 5

  postgres_airflow:
    image: postgres:13
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    restart: always
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5

  # --- Git Sync ---
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.2.0
    container_name: git_sync
    environment:
      - GIT_SYNC_REPO=https://github.com/Tiao553/mlet_sub_activity.git
      - GIT_SYNC_BRANCH=main
      - GIT_SYNC_ROOT=/git
      - GIT_SYNC_DEST=repo
      - GIT_SYNC_WAIT=30
      - GIT_SYNC_ONE_TIME=false
      # Run as root to ensure permissions on the volume, or match Airflow UID
      # Airflow runs as 50000. Let's try to make files readable.
      - GIT_SYNC_UID=50000
    restart: always
    volumes:
      - git-sync-data:/git

  # --- MLflow ---
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: mlflow_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow@postgres_mlflow:5432/mlflow
      - MLFLOW_ARTIFACT_ROOT=s3://${MLFLOW_BUCKET_NAME:-sub-challanger-prd-mlflow-artifacts-593793061865}/mlflow
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    command: mlflow server --backend-store-uri postgresql://mlflow:mlflow@postgres_mlflow:5432/mlflow --default-artifact-root s3://${MLFLOW_BUCKET_NAME:-sub-challanger-prd-mlflow-artifacts-593793061865}/mlflow --host 0.0.0.0
    depends_on:
      postgres_mlflow:
        condition: service_healthy

  # --- Airflow ---
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    restart: always
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_mlflow_data:
  postgres_airflow_data:
  git-sync-data:
